appId: uk.quietbytehq.teamux
productName: Teamux

directories:
  output: dist
  buildResources: assets

files:
  - "src/**/*"
  - "assets/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"

linux:
  artifactName: "${name}-v${version}-linux-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  maintainer: QuietByte <hello@quietbytehq.uk>
  syncDesktopName: true
  category: Network
  icon: assets/icons
  executableName: teamux
  synopsis: Microsoft Teams desktop client with Adaptive Network Guardian, Studio Camera, and low-bandwidth optimization.
  description: |
    Teamux is an enhanced Microsoft Teams desktop client for Linux and Windows.
    Features include the Adaptive Network Guardian for low-bandwidth branch offices,
    in-meeting Studio Beauty Cam, themes engine, and native Wayland/PipeWire/Windows support.

win:
  artifactName: "${name}-v${version}-windows-${arch}.${ext}"
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: assets/icon.ico

portable:
  artifactName: "${name}-v${version}-windows-portable-${arch}.${ext}"

deb:
  packageCategory: net
  priority: optional
  depends:
    - xdg-utils
    - libnotify4
    - libsecret-1-0

appImage:
  category: Network

snap:
  confinement: strict
  grade: stable
  summary: Microsoft Teams client with Adaptive Network Guardian & Studio Camera
  plugs:
    - default
    - camera
    - audio-record
    - screen-inhibit-control
    - network-bind
    - removable-media
